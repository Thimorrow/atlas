<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'">
    <title>Atlas – Verbindung prüfen</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #18181b; color: #fafafa; font: 17px/1.6 system-ui, sans-serif; }
      main { max-width: 440px; padding: 40px; text-align: center; }
      img { width: 80px; height: 80px; }
      h1 { font-size: 26px; line-height: 1.2; }
      p { color: #a1a1aa; }
      a { display: inline-block; margin-top: 12px; padding: 10px 22px; background: #fafafa; color: #18181b; border-radius: 10px; text-decoration: none; font-weight: 600; }
      a:focus-visible { outline: 3px solid #a5b4fc; outline-offset: 5px; }
    </style>
  </head>
  <body>
    <main>
      <img src="icon.png" alt="Atlas">
      <h1>Atlas ist gerade nicht erreichbar</h1>
      <p>Prüfe deine Internetverbindung und versuche es erneut. Auch eine kurze Serverstörung kann die Ursache sein.</p>
      <a href="https://atlas-ten-orpin.vercel.app">Erneut versuchen</a>
    </main>
  </body>
</html>
